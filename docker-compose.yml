services:
  # 1. PostgreSQL 16 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nitivayu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nitivayu_db
      POSTGRES_USER: nitivayu_user
      POSTGRES_PASSWORD: nitivayu_secure_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nitivayu_user -d nitivayu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Temporal Dev Server & UI
  temporal:
    image: temporalio/temporal:latest
    container_name: nitivayu-temporal
    restart: unless-stopped
    # The image defaults to the unprivileged `temporal` user, which cannot
    # write to a freshly-provisioned named volume (root-owned). Run as root
    # so the persistent SQLite file at /data/temporal.db is writable.
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233", "--db-filename", "/data/temporal.db"]
    volumes:
      - temporal_data:/data
    ports:
      - "7233:7233"   # Temporal gRPC
      - "8233:8233"   # Temporal Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nitivayu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://nitivayu_user:nitivayu_secure_password@postgres:5432/nitivayu_db
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      - LLM_CACHE=1
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - OUTPUT_ROOT=/app/output
      - REDIS_URL=redis://redis:6379/0
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-nitivayu-media}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - SMS_PROVIDER=${SMS_PROVIDER:-log}
      - ALLOW_DEV_OTP=${ALLOW_DEV_OTP:-true}
      - OAUTH_CALLBACK_BASE=http://localhost:8000
      - OAUTH_FRONTEND_BASE=http://localhost:3000
      - RATE_LIMIT_AUTH_PER_MIN=${RATE_LIMIT_AUTH_PER_MIN:-20}
      - RATE_LIMIT_SUBMIT_PER_MIN=${RATE_LIMIT_SUBMIT_PER_MIN:-30}
    ports:
      - "8000:8000"
    volumes:
      - output_data:/app/output
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3b. One-shot demo-data seeder: docker compose --profile demo run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nitivayu-seed
    profiles: ["demo"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://nitivayu_user:nitivayu_secure_password@postgres:5432/nitivayu_db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
    command: ["python", "-m", "scripts.seed_data"]

  # 4. Scalable Temporal Python Worker Fleet
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: nitivayu-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://nitivayu_user:nitivayu_secure_password@postgres:5432/nitivayu_db
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      - LLM_CACHE=1
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - OUTPUT_ROOT=/app/output
      - REDIS_URL=redis://redis:6379/0
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-nitivayu-media}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - ASR_ENABLED=${ASR_ENABLED:-false}
      - MODERATION_ENABLED=${MODERATION_ENABLED:-false}
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/torch/sentence_transformers
    volumes:
      - output_data:/app/output
      - model_cache:/root/.cache/torch/sentence_transformers

  # 5. React + Vite Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nitivayu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      # Explicit IPv4 loopback: busybox wget resolves localhost to ::1 first
      # and fails where nginx listens on IPv4; curl is present in the image.
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 6. Redis — cache, OTP/session store, rate limiting, SSE fan-out (§5.2)
  redis:
    image: redis:7-alpine
    container_name: nitivayu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 7. MinIO — S3-compatible object storage for photos/audio/exports (§5.2).
  # The backend auto-creates the bucket on startup; no bootstrap container.
  minio:
    image: minio/minio:latest
    container_name: nitivayu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 8. PgBouncer — transaction pooling so API replicas never exhaust
  # Postgres max_connections (§5.6). Opt in via PGBOUNCER_URL (see .env).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nitivayu-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://nitivayu_user:nitivayu_secure_password@postgres:5432/nitivayu_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=25
    ports:
      - "6432:6432"

  # 9. Prometheus + Grafana — scrape /metrics, visualize latency/errors (§5.8)
  prometheus:
    image: prom/prometheus:latest
    container_name: nitivayu-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: nitivayu-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  output_data:
  model_cache:
  temporal_data:
  redis_data:
  minio_data:
  grafana_data:
