server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Fresh HTML shell every load (kills stale-bundle reports); hashed
    # assets are content-addressed so they cache immutably for a year.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/v1/ {
        # Deferred DNS (variable + resolver): nginx must still start when the
        # backend container is absent (e.g. local-uvicorn dev on :8000).
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
